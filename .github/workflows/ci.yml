name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    # The approved receipt golden is rendered on Windows. Keep the same OS
    # and SDK so the exact pixel comparison remains deterministic.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: pos_machine
    env:
      PAY002_PEER_ROOTS: ${{ github.workspace }}/pos_machine;${{ github.workspace }}/pos_handheld;${{ github.workspace }}/pos_station
    steps:
      - name: Preserve repository bytes on Windows
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          path: pos_machine
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_handheld
          ref: 3f1004b76fde35fb62693615e70ae86eea52575f
          path: pos_handheld
          persist-credentials: false
          ssh-key: ${{ secrets.POS_PEER_HANDHELD_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_station
          ref: d21032a38a8aa3cb9994e7cab60620fdf3804dfd
          path: pos_station
          persist-credentials: false
          ssh-key: ${{ secrets.POS_PEER_STATION_KEY }}
      - name: Verify byte-sensitive checkout files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          core = 'android/app/src/main/kotlin/net/mithqal/softpos/SoftPosBridgeCore.kt'
          checked = 0
          for name in ['pos_machine', 'pos_handheld', 'pos_station']:
              root = Path.cwd().parent / name
              paths = [core]
              if name == 'pos_machine':
                  tracked = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z', '--', 'test'])
                  paths += [p.decode() for p in tracked.split(b'\0') if p.endswith(b'.json')]
              for path in paths:
                  canonical = subprocess.check_output(['git', '-C', str(root), 'show', 'HEAD:' + path])
                  assert (root / path).read_bytes() == canonical, f'Checkout altered bytes: {name}/{path}'
                  checked += 1
          print(f'{checked} byte-sensitive checkout files match their Git blobs')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Use the configured Java 17 runtime
        run: flutter config --jdk-dir "$JAVA_HOME"
      - name: Dependencies from committed lockfile
        run: |
          test ! -e pubspec_overrides.yaml
          flutter pub get --enforce-lockfile
      - name: Analyze (existing style advisories remain non-fatal)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter test suite, including peer bridge hashes
        run: flutter test --no-pub --concurrency=4 --reporter expanded
      - name: Build test APK (local API, not a production release)
        run: flutter build apk --debug --no-pub --dart-define=POS_API_BASE_URL=http://localhost:8088/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: pos_machine-test-apk
          path: pos_machine/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
